<!doctype html>
<html lang="en">
  <body style="margin:0;background:#07090d;color:#f5f7fb;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px">
      <h1 style="font-size:24px;line-height:1.2">Verify your GGMarket email</h1>
      <p style="color:#c4cad5;line-height:1.6">Confirm your email address to finish creating your account.</p>
      <p style="margin:28px 0">
        <a href="https://ggmarket-sage.vercel.app/auth/callback?token_hash={{ .TokenHash }}&amp;type=email&amp;next=%2Fsettings%2Fverification" style="display:inline-block;border-radius:12px;background:#7055df;color:#ffffff;padding:14px 20px;font-weight:700;text-decoration:none">Verify email</a>
      </p>
      <p style="color:#8c96a8;font-size:13px;line-height:1.5">This one-time link expires. If you did not create a GGMarket account, you can ignore this email.</p>
    </div>
  </body>
</html>
