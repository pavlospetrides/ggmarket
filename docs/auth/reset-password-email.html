<!doctype html>
<html lang="en">
  <body style="margin:0;background:#07090d;color:#f5f7fb;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px">
      <h1 style="font-size:24px;line-height:1.2">Reset your GGMarket password</h1>
      <p style="color:#c4cad5;line-height:1.6">Open the secure link, then confirm in GGMarket before the one-time reset is used.</p>
      <p style="margin:28px 0">
        <a href="https://ggmarket.eu/auth/recovery?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;border-radius:12px;background:#7055df;color:#ffffff;padding:14px 20px;font-weight:700;text-decoration:none">Create new password</a>
      </p>
      <p style="color:#8c96a8;font-size:13px;line-height:1.5">This link expires and can be used only once. If you did not request a password reset, you can ignore this email.</p>
    </div>
  </body>
</html>
